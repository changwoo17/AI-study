<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<meta name="description" content="AI 스터디 — 처음 배우는 사람을 위한 여섯 번의 수업">
<title>AI 스터디</title>
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f7f2e8;
    --surface:#fffdf9;
    --ink:#2c2825;
    --muted:#7d736a;
    --line:rgba(90,70,50,.10);
    --accent:#8f5535;
    --hl:rgba(232,203,138,.55);
    --shadow:0 1px 2px rgba(70,50,30,.05),0 10px 24px -18px rgba(70,50,30,.45);
  }
  html{background:var(--bg)}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
    font-size:18px;
    line-height:1.85;
    letter-spacing:-0.01em;
    word-break:keep-all;
    overflow-wrap:break-word;
    -webkit-text-size-adjust:100%;
    text-rendering:optimizeLegibility;
    transition:background .3s ease,color .3s ease;
  }
  button{font-family:inherit;letter-spacing:inherit}
  .bar{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:40;opacity:.55;transition:width .1s linear}

  /* 상단 바 */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(247,242,232,.90);backdrop-filter:saturate(160%) blur(10px);-webkit-backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px 8px 8px;min-height:50px}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .iconbtn:active{background:rgba(120,95,70,.10)}
  .iconbtn svg{width:21px;height:21px;display:block}
  .topbar-t{flex:1;min-width:0;font-size:14.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
  .topbar-t b{color:var(--ink);font-weight:700}
  .dots{display:flex;gap:4px;padding-right:6px}
  .dots i{width:5px;height:5px;border-radius:50%;background:rgba(120,95,70,.22);display:block}
  .dots i.on{background:var(--accent)}

  /* 홈 */
  .hero{padding:26px 22px 4px;max-width:640px;margin:0 auto}
  .hero .kicker{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--accent);margin:0 0 10px}
  .hero h1{margin:0;font-size:32px;line-height:1.25;letter-spacing:-0.035em;font-weight:800}
  .hero p{margin:10px 0 0;color:var(--muted);font-size:15.5px;line-height:1.6}
  .resume{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:18px auto 0;padding:13px 16px;background:rgba(143,85,53,.07);border:1px solid rgba(143,85,53,.16);border-radius:16px;color:var(--ink);font-size:14px;cursor:pointer;text-align:left}
  .resume svg{width:18px;height:18px;flex:0 0 auto;color:var(--accent)}
  .resume span{color:var(--muted)}
  .resume b{font-weight:700;margin-left:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin:0 auto;padding:18px 16px 10px}
  @media (max-width:359px){.grid{grid-template-columns:1fr}}
  .card{position:relative;display:flex;flex-direction:column;gap:9px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px 14px 16px;min-height:158px;cursor:pointer;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}
  .card:active{transform:scale(.982)}
  .card .badge{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;letter-spacing:0}
  .card h3{margin:2px 0 0;font-size:17.5px;line-height:1.4;font-weight:700;letter-spacing:-0.02em}
  .card p{margin:0;font-size:13px;line-height:1.55;color:var(--muted);letter-spacing:-0.005em}
  .card .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--accent);opacity:.85}
  .home-foot{max-width:640px;margin:0 auto;padding:14px 22px 46px;color:#a3988c;font-size:12.5px;line-height:1.7;text-align:center}

  /* 장 화면 */
  .chap-head{padding:22px 22px 2px;max-width:640px;margin:0 auto}
  .chap-head .kicker{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--accent);margin:0 0 8px}
  .chap-head h2{margin:0;font-size:27px;line-height:1.35;letter-spacing:-0.03em;font-weight:800}
  .chap-head .sub{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.6}
  .list{max-width:640px;margin:0 auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px 15px;cursor:pointer;box-shadow:0 1px 1px rgba(70,50,30,.03);transition:transform .14s ease}
  .row:active{transform:scale(.99)}
  .row .num{font-size:12.5px;font-weight:800;color:var(--accent);min-width:32px;letter-spacing:0}
  .row .t{flex:1;font-size:16.5px;font-weight:600;line-height:1.45;letter-spacing:-0.02em}
  .row .chev{color:#c9bdaf;flex:0 0 auto;display:grid;place-items:center}
  .row .chev svg{width:16px;height:16px}
  .list-end{max-width:640px;margin:0 auto;padding:6px 22px 8px;color:#a3988c;font-size:12.5px;text-align:center}

  /* 본문 */
  .article{max-width:640px;margin:0 auto;padding:20px 22px 4px}
  .article .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--accent);margin:0}
  .article h2{margin:9px 0 16px;font-size:25px;line-height:1.4;letter-spacing:-0.03em;font-weight:800}
  .tts-row{display:flex;align-items:center;gap:10px;margin:0 0 22px}
  .tts{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(143,85,53,.22);background:var(--surface);color:var(--accent);border-radius:999px;padding:8px 15px 8px 12px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
  .tts svg{width:16px;height:16px}
  .tts.on{background:var(--accent);color:#fff;border-color:transparent}
  .tts-hint{font-size:12px;color:#a3988c}
  .body p{margin:0 0 1.05em}
  .body p:last-child{margin-bottom:0}
  .body ul,.body ol{margin:.2em 0 1.15em;padding-left:1.3em}
  .body li{margin:0 0 .45em;padding-left:.1em}
  .body li::marker{color:var(--accent);font-weight:700}
  .body strong{font-weight:700;background:linear-gradient(180deg,transparent 62%,var(--hl) 62%);padding:0 1px;border-radius:2px}
  .body .lead{font-size:18px;color:#4a423b}
  .callout{background:rgba(232,203,138,.16);border:1px solid rgba(198,163,94,.28);border-radius:16px;padding:14px 17px;margin:1.4em 0}
  .callout .label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;color:#a3792f;margin-bottom:3px}
  .callout p{margin:0;font-size:16.5px;line-height:1.75}
  .summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:1.3em 0;box-shadow:var(--shadow)}
  .summary .label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-bottom:5px}
  .summary p{margin:0;font-size:17px;line-height:1.8;font-weight:600}
  .prompt{background:#2f2a25;color:#f5ecdf;border-radius:16px;padding:15px 17px;margin:1.2em 0;font-size:15.5px;line-height:1.78;letter-spacing:-0.005em;word-break:keep-all}
  .prompt .label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:#c9a86c;margin-bottom:7px}
  .result{background:rgba(74,98,133,.055);border:1px dashed rgba(74,98,133,.34);border-radius:16px;padding:15px 17px;margin:1.3em 0}
  .result .label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:#435f85;margin-bottom:9px}
  .result .msg{background:#fffdf7;border:1px solid rgba(120,100,70,.13);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.82;color:#3b332a}
  .result p{margin:0 0 .75em;font-size:16.5px;line-height:1.78}
  .result p:last-child{margin-bottom:0}
  .result .note{font-size:15.5px;color:#6b6157}
  .ai-list{display:grid;gap:12px;margin:1.4em 0}
  .ai-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:46px 1fr;gap:13px;align-items:start}
  .ai-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1}
  .ai-name{margin:0 0 4px;font-size:17px;font-weight:800;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .ai-name small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .ai-card p{margin:0 0 .5em;font-size:16.5px;line-height:1.75}
  .ai-card ul{margin:.15em 0 .6em;padding-left:1.05em;font-size:16px;line-height:1.7}
  .ai-card li{margin-bottom:.2em}
  .ai-when{margin:0;font-size:15.5px;line-height:1.7;color:#6b6157}
  .ai-when b{font-weight:800;color:var(--accent)}
  .quote{background:rgba(90,70,50,.05);border-radius:14px;padding:13px 16px;margin:.9em 0;font-size:16.5px;line-height:1.75}
  .table-cards{display:flex;flex-direction:column;gap:9px;margin:1.1em 0 1.3em}
  .tc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 15px}
  .tc h4{margin:0 0 6px;font-size:15px;font-weight:800;color:var(--accent);letter-spacing:-0.01em}
  .tc dl{margin:0;display:grid;grid-template-columns:56px 1fr;gap:3px 8px;font-size:15px;line-height:1.6}
  .tc dt{color:#a3988c;font-size:13px;font-weight:700}
  .tc dd{margin:0}
  .check{list-style:none;padding-left:0}
  .check li{display:flex;gap:9px;align-items:flex-start;margin-bottom:.55em}
  .check li::before{content:"";width:16px;height:16px;margin-top:.42em;border-radius:5px;border:1.5px solid rgba(143,85,53,.4);flex:0 0 auto}
  .signoff{margin-top:1.6em;padding-top:1.1em;border-top:1px dashed rgba(90,70,50,.18);color:var(--muted);font-size:15.5px;line-height:1.7}

  /* 이동 버튼 */
  .nav{max-width:640px;margin:0 auto;padding:26px 20px 0;display:flex;flex-direction:column;gap:10px}
  .navbtns{display:flex;gap:10px}
  .navbtn{flex:1;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 14px;cursor:pointer;text-align:left;min-height:58px;justify-content:center;box-shadow:0 1px 1px rgba(70,50,30,.04)}
  .navbtn small{font-size:11.5px;font-weight:700;color:#a3988c;letter-spacing:.03em}
  .navbtn b{font-size:15.5px;font-weight:600;line-height:1.4;color:var(--ink);letter-spacing:-0.02em}
  .navbtn.next{text-align:right;align-items:flex-end}
  .navbtn:disabled{opacity:.38;cursor:default}
  .navbtn.wide{background:rgba(143,85,53,.08);border-color:rgba(143,85,53,.18)}
  .navbtn.wide small{color:var(--accent)}
  .ghost{align-self:center;background:transparent;border:0;color:var(--muted);font-size:14px;padding:10px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(120,100,80,.35)}
  .endspace{height:34px}

  @media (min-width:720px){
    .hero{padding-top:40px}
    .hero h1{font-size:38px}
    .grid{grid-template-columns:1fr 1fr 1fr;gap:14px;padding:22px 18px}
    .card{min-height:170px}
    .article{padding-top:30px}
    .article h2{font-size:29px}
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191715;
      --surface:#232019;
      --ink:#ece3d5;
      --muted:#a09385;
      --line:rgba(230,210,180,.12);
      --accent:#d59a6d;
      --hl:rgba(160,120,60,.42);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -18px rgba(0,0,0,.8);
    }
    .topbar{background:rgba(25,23,21,.90)}
    .prompt{background:#241f19;color:#f0e6d6;border:1px solid rgba(230,210,180,.14)}
    .result{background:rgba(120,150,190,.08);border-color:rgba(150,180,215,.28)}
    .result .label{color:#9fb8d4}
    .result .msg{background:#20262e;border-color:rgba(150,180,215,.16);color:#e6dfd2}
    .result .note{color:#a39786}
    .callout{background:rgba(160,120,60,.12);border-color:rgba(200,160,90,.25)}
    .callout .label{color:#d8ad6a}
    .home-foot{color:#7a6f63}
    .row .chev{color:#5c5348}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="app"></div>

<script>
"use strict";

var BOOK = [
  {
    id: 1,
    title: "AI란 무엇인가",
    accent: "#9c5b3f",
    desc: "AI라는 말의 뜻부터, 생활 속 AI 찾기까지",
    sections: [
      {
        id: "1-1", title: "AI라는 말",
        html: `<p class="lead">여기서 AI는 인공지능, 영어로 Artificial Intelligence예요. 사람이 하는 지능을 기계가 하게 만든 것, 그게 AI입니다.</p>
<p>그런데 '지능'이 뭘까요. 어렵게 생각할 것 없습니다. 컴퓨터를 하드웨어와 소프트웨어로 나누듯이, 지능도 몇 갈래로 나눠 볼 수 있어요.</p>
<ul>
<li><strong>알아보기</strong> — 눈과 귀. 보고 듣고 알아차리는 일</li>
<li><strong>생각하기</strong> — 머리. 아는 것을 가지고 판단하고 짐작하는 일</li>
<li><strong>표현하기</strong> — 입과 손. 말하고 쓰고 그리는 일</li>
</ul>
<p>사람은 이 셋을 다 합니다. AI는 이 셋 중 하나, 또는 몇 가지를 기계가 하도록 만든 것이고요.</p>
<p>그러니 AI는 사람을 통째로 흉내 내는 물건이 아니라, 사람의 지능을 잘게 나눠 하나씩 맡기는 쪽에 가깝습니다.</p>`
      },
      {
        id: "1-2", title: "지능의 세 갈래",
        html: `<p>방금 나눈 세 갈래를 하나씩 만나 볼까요.</p>
<p><strong>알아보기</strong>를 하는 AI는 사진 속에서 사람을 찾아내고, 말소리를 글자로 받아 적고, 손글씨 숫자를 읽습니다.</p>
<p><strong>생각하기</strong>를 하는 AI는 이 메일이 광고인지 아닌지 판단하고, 이 사람이 다음에 무엇을 살지 짐작합니다.</p>
<p><strong>표현하기</strong>를 하는 AI는 글을 쓰고, 그림을 그리고, 목소리로 말합니다. 요즘 화제인 챗GPT가 여기에 들어갑니다.</p>
<p>셋으로 나눠 놓으면 따로 노는 것 같지만, 실제로는 이어져 있습니다. 알아본 다음 생각하고, 생각한 다음 표현하니까요.</p>`
      },
      {
        id: "1-3", title: "사람과 다른 점",
        html: `<p>같은 '알아보기'라도 방식은 꽤 다릅니다.</p>
<p>사람은 고양이를 두세 번 보면 고양이를 압니다. AI는 수천, 수만 장의 고양이 사진을 봐야 알아요. 대신 그 많은 양을 사람보다 훨씬 빠르게 봅니다.</p>
<p>그리고 사람은 왜 그렇게 판단했는지 설명할 수 있습니다. 반면 AI는 대개 "그럴 확률이 높아서"라고 답합니다.</p>
<p>이 차이가 뒤에서 배울 'AI가 틀리는 이유'로 이어집니다. 지금은 이 한 줄만 기억해 두세요. <strong>많이 보고 배우지만, 설명은 못 한다.</strong></p>`
      },
      {
        id: "1-4", title: "옛날 AI와 요즘 AI",
        html: `<p>옛날 방식은 사람이 규칙을 하나하나 적어 주는 것이었습니다. 예를 들어 "제목에 '광고'라는 글자가 들어 있으면 스팸으로 걸러라" 같은 식이죠.</p>
<p>그런데 사람들은 '광고'라는 말을 피해서 메일을 보냅니다. 규칙을 아무리 많이 적어도 예외가 끝없이 생겼어요.</p>
<p>요즘 방식은 반대입니다. 규칙을 사람이 적는 대신, <strong>예를 잔뜩 보여 주고 스스로 규칙을 찾게 합니다.</strong> 이것을 '기계학습', 또는 '머신러닝'이라고 부릅니다.</p>
<p>스팸 메일 수십만 통을 보여 주면, AI가 스팸의 특징을 스스로 찾아냅니다. 챗GPT는 이 기계학습 가운데서도 <strong>글</strong>을 다루는 쪽에 속하고요.</p>`
      },
      {
        id: "1-5", title: "생활 속 AI 찾아보기",
        html: `<p>AI는 이미 우리 주변에 있습니다. 찾아보면 하루에도 몇 번씩 만나게 됩니다.</p>
<ul>
<li>길찾기 앱이 막히는 길을 미리 알려 주는 것</li>
<li>유튜브와 넷플릭스가 취향에 맞는 영상을 골라 주는 것</li>
<li>음성비서에게 말을 걸면 알아듣는 것</li>
<li>휴대폰 사진이 저절로 밝아지고 흔들림이 잡히는 것</li>
<li>외국어를 카메라로 비추면 바로 번역되는 것</li>
<li>스팸 문자와 전화를 걸러 주는 것</li>
</ul>
<p>이 목록에 다 없어도 괜찮습니다. 스마트폰 하나 안에도 훨씬 많으니까요.</p>
<div class="callout"><span class="label">해 볼 것</span><p>오늘 하루, 나는 AI를 몇 번 만났을까요? 하나씩 세어 보세요.</p></div>`
      },
      {
        id: "1-6", title: "1장 한 줄 요약",

/* ---------- 주소(#) 해석 ---------- */
function parseHash(){
  var h = (location.hash || "").replace(/^#\/?/, "");
  var parts = h.split("/");
  var ch = CH[parts[0]];
  if(!ch) return { view: "home" };
  if(parts[1]){
    for(var i = 0; i < ch.sections.length; i++){
      if(ch.sections[i].id === parts[0] + "-" + parts[1]){
        return { view: "section", ch: ch, sec: ch.sections[i], idx: i };
      }
    }
  }
  return { view: "chapter", ch: ch };
}

var suppressHash = false;
function go(path){
  if(location.hash === "#" + path){ render(); return; }
  try{
    history.pushState({ p: path }, "", "#" + path);
    render();
  }catch(e){
    suppressHash = true;
    location.hash = path;
  }
}

/* ---------- 읽어 주기 ---------- */
var tts = { on: false, chunks: [], i: 0, btn: null, voices: [] };
var ttsSupported = (typeof window.speechSynthesis !== "undefined") && (typeof window.SpeechSynthesisUtterance !== "undefined");

function loadVoices(){
  if(!ttsSupported) return;
  try{ tts.voices = window.speechSynthesis.getVoices() || []; }catch(e){ tts.voices = []; }
}
loadVoices();
if(ttsSupported && typeof window.speechSynthesis.addEventListener === "function"){
  window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
}

function koVoice(){
  for(var i = 0; i < tts.voices.length; i++){
    var v = tts.voices[i];
    if(/ko(-|_)KR/i.test(v.lang) || /^ko/i.test(v.lang)) return v;
  }
  return null;
}

function plainText(html){
  var d = document.createElement("div");
  d.style.cssText = "position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden";
  d.innerHTML = html;
  document.body.appendChild(d);
  var t = d.innerText || d.textContent || "";
  document.body.removeChild(d);
  return t.replace(/\u00a0/g, " ").replace(/[ \t]+/g, " ").replace(/\n\s*\n/g, "\n").trim();
}

function chunkText(text){
  var sents = text.split(/\n/).reduce(function(acc, line){
    var m = line.match(/[^.!?。!?]*[.!?。]+\s*|[^.!?。]+$/g);
    if(m) m.forEach(function(s){ if(s.trim()) acc.push(s.trim()); });
    return acc;
  }, []);
  var out = [], buf = "";
  sents.forEach(function(s){
    if((buf + " " + s).length > 170){ if(buf) out.push(buf); buf = s; }
    else buf = buf ? buf + " " + s : s;
  });
  if(buf) out.push(buf);
  return out;
}

function speakNext(){
  if(!tts.on || tts.i >= tts.chunks.length){ stopTTS(); return; }
  var u = new SpeechSynthesisUtterance(tts.chunks[tts.i++]);
  u.lang = "ko-KR";
  u.rate = 0.95;
  u.pitch = 1;
  var v = koVoice();
  if(v) u.voice = v;
  u.onend = function(){ if(tts.on) speakNext(); };
  u.onerror = function(){ if(tts.on) stopTTS(); };
  try{ window.speechSynthesis.speak(u); }catch(e){ stopTTS(); }
}

function paintTTS(){
  if(!tts.btn) return;
  tts.btn.classList.toggle("on", tts.on);
  tts.btn.innerHTML = (tts.on ? ICON_STOP : ICON_PLAY) + "<span>" + (tts.on ? "멈춤" : "읽어 주기") + "</span>";
}

function stopTTS(){
  tts.on = false;
  tts.chunks = [];
  tts.i = 0;
  if(ttsSupported){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  paintTTS();
}

function startTTS(){
  var st = parseHash();
  if(st.view !== "section") return;
  var p = st.sec.id.split("-");
  var head = p[0] + "장 " + p[1] + "절. " + st.sec.title + ". ";
  tts.chunks = chunkText(head + plainText(st.sec.html));
  tts.i = 0;
  tts.on = true;
  paintTTS();
  speakNext();
}

/* ---------- 진행 저장 ---------- */
var LS_KEY = "aistudy.last.v1";
function saveLast(ch, sec){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      ch: ch.id, id: sec.id, title: sec.title, path: "/" + ch.id + "/" + sec.id.split("-")[1]
    }));
  }catch(e){}
}
function loadLast(){
  try{
    var v = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if(v && CH[v.ch] && v.title && v.path) return v;
  }catch(e){}
  return null;
}

function viewSection(ch, sec, idx){
  var n = sec.id.split("-")[1];

    return '<i class="' + (i === idx ? "on" : "") + '"></i>';

  var ttsRow = ttsSupported
    ? '<div class="tts-row"><button class="tts" id="ttsBtn" aria-label="이 절 읽어 주기">' + ICON_PLAY + '<span>읽어 주기</span></button><span class="tts-hint">소리로 들어 보세요</span></div>'
    : "";

  var prevBtn = idx > 0
    ? '<button class="navbtn" data-go="/' + ch.id + '/' + ch.sections[idx - 1].id.split("-")[1] + '"><small>이전 절</small><b>' + ch.sections[idx - 1].title + '</b></button>'
    : '<button class="navbtn" disabled><small>이전 절</small><b>이 장의 처음입니다</b></button>';

  var nextBtn;
  if(idx < ch.sections.length - 1){
    nextBtn = '<button class="navbtn next" data-go="/' + ch.id + '/' + ch.sections[idx + 1].id.split("-")[1] + '"><small>다음 절</small><b>' + ch.sections[idx + 1].title + '</b></button>';
  }else{
    var nextCh = CH[ch.id + 1];
    nextBtn = nextCh
      ? '<button class="navbtn next" data-go="/' + nextCh.id + '"><small>다음 장</small><b>' + nextCh.title + '</b></button>'
      : '<button class="navbtn next" data-go="/"><small>끝</small><b>처음으로</b></button>';
  }

  var after = "";
  if(idx === ch.sections.length - 1){
    var nx = CH[ch.id + 1];
    if(nx){
      after = '<button class="navbtn wide" data-go="/' + nx.id + '"><small>' + nx.id + '장으로</small><b>' + nx.title + '</b></button>';
    }else{
      after = '<button class="navbtn wide" data-go="/"><small>여섯 장을 모두 마쳤습니다</small><b>홈으로 돌아가기</b></button>';
    }
  }

  return head +
    '<article class="article" style="--accent:' + ch.accent + '">' +
      '<p class="meta">' + sec.id + ' · ' + (idx + 1) + '/' + ch.sections.length + '</p>' +

      ttsRow +
      '<div class="body">' + sec.html + '</div>' +

      '<div class="navbtns">' + prevBtn + nextBtn + '</div>' +
      after +
      '<button class="ghost" data-go="/' + ch.id + '">장 목차로</button>' +
    '</div><div class="endspace"></div>';
}

    tts.btn = document.getElementById("ttsBtn");
  }
  window.scrollTo(0, 0);
  if(!barOn) bar.style.width = "0%";
}

/* ---------- 사건 ---------- */
app.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-go]") : null;
  if(t){
    var p = t.getAttribute("data-go");
    if(p) go(p);
    return;
  }
  var tb = e.target.closest ? e.target.closest("#ttsBtn") : null;
  if(tb){
    if(tts.on) stopTTS(); else startTTS();
  }
});

function flatIndex(sec){
  for(var i = 0; i < FLAT.length; i++){ if(FLAT[i].sec === sec) return i; }
  return -1;
}

/* 키보드: 좌우 화살표로 절 이동 (PC) */
document.addEventListener("keydown", function(e){
  if(e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  var st = parseHash();
  if(st.view !== "section") return;
  if(e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  var i = flatIndex(st.sec);
  if(i < 0) return;
  var nx = FLAT[i + (e.key === "ArrowRight" ? 1 : -1)];
  if(nx){ go("/" + nx.ch.id + "/" + nx.sec.id.split("-")[1]); }
  else if(e.key === "ArrowRight"){
    var c2 = CH[st.ch.id + 1];
    go(c2 ? "/" + c2.id : "/");
  }else{
    go("/" + st.ch.id);
  }
});

window.addEventListener("popstate", function(){ render(); });
window.addEventListener("hashchange", function(){
  if(suppressHash){ suppressHash = false; return; }
  render();
});
window.addEventListener("pagehide", function(){ if(ttsSupported){ try{ window.speechSynthesis.cancel(); }catch(e){} } });

function onScroll(){
  if(!barOn){ return; }
  var d = document.documentElement;
  var max = d.scrollHeight - window.innerHeight;
  var pct = max > 40 ? (window.pageYOffset || d.scrollTop) / max : 0;
  bar.style.width = Math.max(0, Math.min(1, pct)) * 100 + "%";
}
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", onScroll);

render();
</script>
