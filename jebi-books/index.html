<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제비책방 — 우리가 함께 읽은 책</title>
<meta name="description" content="한 달에 한 번 모여 읽고 이야기한 책들의 기록. 작가 소개, 줄거리, 그리고 발제 열 가지.">
<meta name="theme-color" content="#19120d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2319120d'/%3E%3Crect x='3.5' y='3.5' width='57' height='57' rx='9' fill='none' stroke='%23c9a568' stroke-width='1.6'/%3E%3Ctext x='32' y='45' font-size='30' text-anchor='middle' fill='%23e6cf9f'%3E%E2%9D%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* wood + brass + cream : antique walnut library */
    --walnut-950:#140e09;
    --walnut-900:#19120d;
    --walnut-850:#1e150e;
    --walnut-800:#241912;
    --walnut-700:#2e2118;
    --walnut-600:#3a2a1d;
    --brass:#c9a568;
    --brass-lt:#e3c78d;
    --brass-soft:#a8834a;
    --brass-dim:#7c6035;

    --cream:#f2e7d2;
    --cream-2:#dfcdb0;
    --muted:#b3a189;
    --muted-2:#9a8871;

    --parch-1:#f7efdd;
    --parch-2:#f2e7d0;
    --parch-3:#eadcbf;
    --parch-line:#c9b491;

    --ink:#261c15;
    --ink-2:#33261a;
    --ink-soft:#5f4c39;

    --line:rgba(201,165,104,.20);
    --line-2:rgba(201,165,104,.36);

    --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--walnut-900);
    color:var(--cream);
    font-family:var(--serif);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  /* candle-lit wall: warm light falling from the top of the room */
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1150px 600px at 50% -10%,rgba(255,171,74,.22),rgba(255,150,60,.07) 42%,transparent 70%),
      radial-gradient(820px 460px at 10% 4%,rgba(255,192,112,.08),transparent 62%),
      radial-gradient(760px 460px at 92% 8%,rgba(255,176,92,.07),transparent 62%),
      linear-gradient(180deg,#1a130d 0%,#1e150e 26%,#19120d 58%,#141009 100%);
  }
  /* old paper grain over everything */
  body::after{
    content:'';position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.5;
    background-image:url(img/noise.png);background-size:110px 110px;
    mix-blend-mode:soft-light;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%}
  .wrap{position:relative;z-index:1;width:100%;max-width:1080px;margin:0 auto;padding:0 22px}
  @media (max-width:400px){ .wrap{padding:0 16px} }

  /* ---------- running head (shop fascia) ---------- */
  .site-head{position:relative;z-index:2;padding-top:3px}
  .site-head .top-rule{
    height:4px;
    background:
      linear-gradient(90deg,transparent 0%,rgba(201,165,104,.55) 22%,rgba(227,199,141,.8) 50%,rgba(201,165,104,.55) 78%,transparent 100%) top/100% 1px no-repeat,
      linear-gradient(90deg,transparent 0%,rgba(201,165,104,.20) 30%,rgba(201,165,104,.30) 50%,rgba(201,165,104,.20) 70%,transparent 100%) bottom/100% 1px no-repeat;
  }
  .head-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:15px 0 14px;border-bottom:1px solid rgba(201,165,104,.14);
  }
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
  .brand .mark{color:var(--brass);font-size:13px;line-height:1;transform:translateY(-1px)}
  .brand .name{
    font-family:var(--serif);font-size:17px;font-weight:600;
    letter-spacing:.3em;text-indent:.3em;color:#f4e8d1;
    text-shadow:0 0 22px rgba(255,180,90,.18);
  }
  .head-note{
    font-size:11.5px;color:var(--muted-2);letter-spacing:.14em;
    display:flex;align-items:center;gap:10px;white-space:nowrap;
  }
  .head-note::before{content:'';width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--brass-dim))}
  @media (max-width:700px){ .head-note{display:none} }

  /* ---------- home : hero sign ---------- */
  .hero{
    position:relative;isolation:isolate;overflow:hidden;
    margin:26px 0 0;border:1px solid var(--line-2);border-radius:2px;
    box-shadow:0 34px 60px -40px #000, inset 0 0 0 1px rgba(0,0,0,.5);
  }
  .hero-wall{
    position:absolute;inset:0;z-index:-1;
    background:url("img/library-banner.jpg") center 42%/cover no-repeat;
    opacity:.92;
  }
  .hero-wall::after{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(64% 54% at 50% 34%,rgba(255,186,96,.20),transparent 72%),
      linear-gradient(180deg,rgba(21,15,10,.52) 0%,rgba(21,15,10,.72) 52%,rgba(20,14,9,.96) 100%);
  }
  @media (max-width:700px){
    .hero-wall{background-position:56% 40%;opacity:.86}
    .hero-wall::after{background:
      radial-gradient(90% 40% at 50% 26%,rgba(255,186,96,.18),transparent 74%),
      linear-gradient(180deg,rgba(21,15,10,.66) 0%,rgba(21,15,10,.85) 55%,rgba(20,14,9,.97) 100%)}
  }
  .sign{
    position:relative;z-index:1;margin:clamp(22px,5.4vw,46px) auto;
    max-width:620px;padding:clamp(24px,5vw,40px) clamp(16px,4.4vw,38px) clamp(22px,4.6vw,36px);
    text-align:center;
    border:1px solid rgba(201,165,104,.40);
    background:rgba(24,17,11,.30);
    box-shadow:inset 0 0 0 4px rgba(20,14,9,.55), inset 0 0 0 5px rgba(201,165,104,.14), 0 18px 50px -30px #000;
  }
  .sign::before{
    content:'';position:absolute;inset:-1px;pointer-events:none;
    background:
      linear-gradient(var(--brass),var(--brass)) left 0 top 0/13px 1px no-repeat,
      linear-gradient(var(--brass),var(--brass)) left 0 top 0/1px 13px no-repeat,
      linear-gradient(var(--brass),var(--brass)) right 0 top 0/13px 1px no-repeat,
      linear-gradient(var(--brass),var(--brass)) right 0 top 0/1px 13px no-repeat,
      linear-gradient(var(--brass),var(--brass)) left 0 bottom 0/13px 1px no-repeat,
      linear-gradient(var(--brass),var(--brass)) left 0 bottom 0/1px 13px no-repeat,
      linear-gradient(var(--brass),var(--brass)) right 0 bottom 0/13px 1px no-repeat,
      linear-gradient(var(--brass),var(--brass)) right 0 bottom 0/1px 13px no-repeat;
    opacity:.85;
  }
  .sign .crest{display:block;color:var(--brass);font-size:13px;letter-spacing:.5em;text-indent:.5em;margin-bottom:12px}
  .sign h1{
    font-family:var(--serif);font-weight:600;color:#f8eeda;
    font-size:clamp(36px,8.6vw,62px);line-height:1.12;
    letter-spacing:.17em;text-indent:.17em;margin:0;
    text-shadow:0 2px 1px rgba(0,0,0,.55),0 0 40px rgba(255,183,96,.28);
  }
  .ornament{display:flex;align-items:center;justify-content:center;gap:11px;margin:15px auto 14px;max-width:300px}
  .ornament i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,165,104,.62),transparent)}
  .ornament b{color:var(--brass);font-size:8px;line-height:1;letter-spacing:0}
  .sign .tagline{
    font-family:var(--serif);font-size:clamp(13.4px,3.5vw,16px);line-height:1.7;
    color:#ecdcbf;letter-spacing:.06em;margin:0;
  }
  .sign .lede{
    font-size:12.4px;line-height:1.85;color:var(--muted);
    max-width:30em;margin:16px auto 0;letter-spacing:.01em;
  }
  .sign .lede strong{color:var(--brass-lt);font-weight:500}

  /* shelf label between hero and year plaques */
  .shelf-label{
    display:flex;align-items:center;gap:14px;
    margin:34px 0 2px;color:var(--brass-soft);
    font-size:10.5px;letter-spacing:.34em;text-indent:.34em;
  }
  .shelf-label::before,.shelf-label::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(201,165,104,.28),transparent)}

  /* ---------- home : year plaques ---------- */
  .years{display:grid;grid-template-columns:repeat(auto-fit,minmax(266px,1fr));gap:22px;padding:24px 0 14px}
  .year-card{
    position:relative;display:block;isolation:isolate;overflow:hidden;
    padding:22px 20px 16px;border-radius:2px;
    border:1px solid rgba(201,165,104,.26);
    background:
      radial-gradient(120% 76% at 50% -18%,rgba(255,196,116,.11),transparent 62%),
      repeating-linear-gradient(91deg,rgba(255,205,148,.022) 0 2px,rgba(0,0,0,0) 2px 11px,rgba(0,0,0,.05) 11px 13px,rgba(0,0,0,0) 13px 27px),
      linear-gradient(178deg,#3a2a1c 0%,#2b1e15 40%,#221710 78%,#19110b 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,216,160,.13),
      inset 0 -1px 0 rgba(0,0,0,.6),
      0 22px 38px -26px #000;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .year-card::before{
    content:'';position:absolute;inset:5px;pointer-events:none;border:1px solid rgba(201,165,104,.15);border-radius:1px;
  }
  .year-card .corners{
    position:absolute;inset:5px;pointer-events:none;
    background:
      linear-gradient(var(--brass-dim),var(--brass-dim)) left 0 top 0/10px 1px no-repeat,
      linear-gradient(var(--brass-dim),var(--brass-dim)) left 0 top 0/1px 10px no-repeat,
      linear-gradient(var(--brass-dim),var(--brass-dim)) right 0 top 0/10px 1px no-repeat,
      linear-gradient(var(--brass-dim),var(--brass-dim)) right 0 top 0/1px 10px no-repeat,
      linear-gradient(var(--brass-dim),var(--brass-dim)) left 0 bottom 0/10px 1px no-repeat,
      linear-gradient(var(--brass-dim),var(--brass-dim)) left 0 bottom 0/1px 10px no-repeat,
      linear-gradient(var(--brass-dim),var(--brass-dim)) right 0 bottom 0/10px 1px no-repeat,
      linear-gradient(var(--brass-dim),var(--brass-dim)) right 0 bottom 0/1px 10px no-repeat;
    opacity:.7;
  }
  .year-card::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;
    background:radial-gradient(90% 58% at 50% -6%,rgba(255,181,92,.13),transparent 70%);
  }
  .year-card:hover,.year-card:focus-visible{
    transform:translateY(-3px);border-color:rgba(201,165,104,.46);
    box-shadow:inset 0 1px 0 rgba(255,216,160,.18), 0 26px 44px -26px #000, 0 0 0 1px rgba(201,165,104,.10);
  }
  .year-card .yr{
    display:block;font-family:var(--serif);font-weight:600;
    font-size:31px;letter-spacing:.16em;text-indent:.16em;line-height:1.2;
    color:#f5e8cf;text-shadow:0 1px 0 rgba(0,0,0,.55);
  }
  .year-card .sub{display:block;font-size:11.5px;color:var(--muted-2);letter-spacing:.16em;margin-top:5px}
  .year-card .sub::after{
    content:'';display:block;width:30px;height:1px;margin-top:11px;
    background:linear-gradient(90deg,var(--brass-soft),rgba(201,165,104,0));
  }
  .stack{
    position:relative;display:flex;align-items:flex-end;justify-content:center;
    gap:clamp(6px,2.6%,14px);margin:24px 0 18px;padding:0 1% 12px;
  }
  .stack::before{
    content:'';position:absolute;left:0;right:0;top:0;bottom:12px;pointer-events:none;
    background:radial-gradient(66% 100% at 50% 0%,rgba(255,196,116,.22),transparent 74%);
  }
  .stack::after{
    content:'';position:absolute;left:-6px;right:-6px;bottom:0;height:11px;
    border-radius:1px;
    background:linear-gradient(180deg,#5b4029 0%,#3d2a1a 42%,#1c130c 100%);
    box-shadow:0 -1px 0 rgba(255,214,156,.34), 0 10px 16px -8px rgba(0,0,0,.95);
  }
  .stack img{
    position:relative;z-index:1;width:clamp(66px,30%,118px);height:auto;aspect-ratio:7/10;
    object-fit:cover;border-radius:2px;
    background:#2a1d14;
    box-shadow:0 14px 22px -14px rgba(0,0,0,.95), 0 0 0 1px rgba(201,165,104,.18);
    transform-origin:bottom center;
  }
  .stack img:nth-child(1){transform:rotate(-4deg)}
  .stack img:nth-child(2){transform:rotate(0deg) translateY(-5px)}
  .stack img:nth-child(3){transform:rotate(4deg)}
  @media (max-width:639px){
    .stack{gap:8px;margin:18px 0 14px}
  }
  .year-card .go{
    display:flex;align-items:center;justify-content:flex-end;gap:8px;
    font-size:12px;letter-spacing:.16em;color:var(--brass);
    border-top:1px solid rgba(201,165,104,.16);padding-top:11px;
    transition:color .2s ease;
  }
  .year-card .go::after{content:'→';font-size:12px;transition:transform .2s ease}
  .year-card:hover .go{color:var(--brass-lt)}
  .year-card:hover .go::after{transform:translateX(3px)}

  .home-foot{
    text-align:center;padding:22px 0 56px;color:var(--muted-2);
    font-size:11.5px;letter-spacing:.2em;
  }
  .home-foot .dot{color:var(--brass-dim);margin:0 8px}

  /* ---------- back link ---------- */
  .back{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.14em;color:var(--brass);
    padding:7px 0;transition:color .18s ease;
  }
  .back:hover{color:var(--brass-lt)}

  /* ---------- year / shelf page ---------- */
  .page-top{padding-top:20px}
  .year-head{
    position:relative;display:flex;align-items:flex-end;justify-content:space-between;
    gap:14px;flex-wrap:wrap;padding:6px 0 17px;margin:8px 0 26px;
    border-bottom:1px solid rgba(201,165,104,.26);
  }
  .year-head::after{
    content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;
    background:linear-gradient(90deg,rgba(201,165,104,.22),rgba(201,165,104,.06) 60%,transparent);
  }
  .year-head h1{
    font-family:var(--serif);font-weight:600;color:#f6ead2;
    font-size:clamp(32px,7.4vw,46px);letter-spacing:.12em;text-indent:.12em;
    line-height:1.1;margin:0;text-shadow:0 0 40px rgba(255,180,90,.16);
  }
  .year-head .count{font-size:11.5px;letter-spacing:.2em;color:var(--muted-2);padding-bottom:8px}

  /* the wall the bookcase stands against */
  .shelf-wall::before{
    content:'';position:absolute;left:-1px;right:-1px;top:-1px;height:9px;border-radius:2px 2px 0 0;
    background:linear-gradient(180deg,#543a26 0%,#37251a 62%,#241811 100%);
    box-shadow:inset 0 1px 0 rgba(255,214,156,.30), 0 3px 8px -2px rgba(0,0,0,.7);
  }
  .shelf-wall{
    position:relative;padding:30px 16px 12px;border-radius:2px;
    border:1px solid rgba(201,165,104,.13);
    background:
      radial-gradient(120% 62% at 50% -14%,rgba(255,172,82,.11),transparent 66%),
      repeating-linear-gradient(90deg,rgba(255,205,148,.020) 0 2px,rgba(0,0,0,0) 2px 13px,rgba(0,0,0,.045) 13px 16px,rgba(0,0,0,0) 16px 32px),
      linear-gradient(180deg,#241a12 0%,#191109 62%,#120d08 100%);
    box-shadow:inset 0 1px 0 rgba(255,214,156,.06), 0 30px 60px -50px #000;
  }
  @media (max-width:520px){ .shelf-wall{padding:20px 10px 10px} }

  .grid{
    --gap:16px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:30px var(--gap);
  }
  @media (min-width:600px){ .grid{--gap:20px;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:34px var(--gap)} }
  @media (min-width:880px){ .grid{--gap:24px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:40px var(--gap)} }

  .book{display:block;position:relative;transition:transform .2s ease}
  .book:hover,.book:focus-visible{transform:translateY(-4px)}

  .cover{
    position:relative;display:block;width:100%;aspect-ratio:7/10;overflow:hidden;border-radius:2px;
    background:#2a1d14;
    box-shadow:0 16px 26px -16px rgba(0,0,0,.95), 0 0 0 1px rgba(201,165,104,.20);
  }
  .cover img{display:block;width:100%;height:100%;object-fit:cover}
  .cover::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(158deg,rgba(255,240,214,.16) 0%,rgba(255,240,214,0) 34%,rgba(0,0,0,.16) 100%);
    mix-blend-mode:soft-light;
  }

  /* the wooden shelf lip each book stands on */
  .plank{
    display:block;position:relative;height:11px;
    margin:0 calc(var(--gap) / -2 + 1px);
    border-radius:1px;
    background:linear-gradient(180deg,#65482e 0%,#432e1c 38%,#1b120b 100%);
    box-shadow:0 -1px 0 rgba(255,214,156,.34), 0 9px 16px -7px rgba(0,0,0,.95);
  }
  .plank::after{
    content:'';position:absolute;left:9%;right:9%;top:-7px;height:7px;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
    opacity:.5;
  }

  .cap{display:block;padding:10px 2px 0}
  .cap .no{
    display:block;font-family:var(--sans);font-size:9.5px;font-weight:600;
    letter-spacing:.26em;color:var(--brass);line-height:1;
  }
  .cap .t{
    display:block;font-family:var(--serif);font-weight:600;font-size:14.4px;line-height:1.45;
    color:#f1e6ce;margin:7px 0 3px;letter-spacing:.005em;
    text-shadow:0 1px 0 rgba(0,0,0,.5);
    word-break:keep-all;overflow-wrap:break-word;
  }
  .cap .a{display:block;font-size:11px;color:var(--muted-2);line-height:1.5;letter-spacing:.02em}
  @media (max-width:759px){
    .cap{padding-top:9px}
    .cap .t{font-size:12.8px;margin:6px 0 2px}
    .cap .a{font-size:10.5px}
  }

  .empty{padding:34px 0 46px;text-align:center;color:var(--muted);font-size:13px;letter-spacing:.06em}

  /* ---------- detail ---------- */
  .detail{padding-bottom:30px}
  .detail-top{padding:18px 0 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .detail-top .crumb{font-size:10.5px;letter-spacing:.24em;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .detail-grid{
    display:grid;gap:18px;
    grid-template-columns:108px minmax(0,1fr);
    grid-template-areas:"cover head" "reading reading" "pager pager";
    align-items:start;padding:20px 0 0;
  }
  .cover-col{grid-area:cover;min-width:0}
  .big-cover{
    position:relative;width:100%;aspect-ratio:7/10;overflow:hidden;border-radius:2px;background:#2a1d14;
    box-shadow:0 26px 40px -22px rgba(0,0,0,.95), 0 0 0 1px rgba(201,165,104,.24);
  }
  .big-cover img{display:block;width:100%;height:100%;object-fit:cover}
  .big-cover::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(158deg,rgba(255,240,214,.18),transparent 36%,rgba(0,0,0,.18));
    mix-blend-mode:soft-light;
  }
  .cover-meta{display:none}
  .head-body{grid-area:head;min-width:0}
  .eyebrow{
    display:block;font-family:var(--sans);font-size:9.5px;font-weight:600;
    letter-spacing:.28em;color:var(--brass-soft);line-height:1.4;
  }
  .book-title{
    font-family:var(--serif);font-weight:600;color:#f7ecd8;
    font-size:clamp(24px,6.4vw,40px);line-height:1.28;letter-spacing:.005em;
    margin:9px 0 8px;text-shadow:0 1px 0 rgba(0,0,0,.5),0 0 40px rgba(255,180,90,.13);
    word-break:keep-all;overflow-wrap:break-word;
  }
  .book-sub{
    font-family:var(--serif);font-size:13.8px;line-height:1.65;
    color:var(--cream-2);margin:0 0 10px;letter-spacing:.01em;
    word-break:keep-all;overflow-wrap:break-word;
  }
  .book-author{font-size:12.6px;letter-spacing:.1em;color:var(--brass);margin:0}
  .book-meta{display:block;font-size:11px;line-height:1.7;color:var(--muted-2);margin:9px 0 0}
  @media (min-width:820px){
    .detail-grid{
      grid-template-columns:282px minmax(0,1fr);
      grid-template-areas:"cover head" "cover reading" "cover pager";
      grid-template-rows:auto 1fr auto;
      gap:0 48px;padding:24px 0 0;
    }
    .cover-col{position:sticky;top:24px;align-self:start}
    .head-body{padding-bottom:22px}
    .cover-meta{
      display:block;margin-top:12px;padding:9px 12px;
      border:1px solid rgba(201,165,104,.22);background:rgba(255,220,160,.028);
      font-size:10.5px;line-height:1.75;letter-spacing:.04em;color:var(--muted-2);
    }
    .cover-meta .k{color:var(--cream-2)}
    .eyebrow{font-size:10.5px;letter-spacing:.32em}
    .book-sub{font-size:15px;margin-bottom:13px}
    .book-author{font-size:13.4px}
    .book-meta{display:none}
  }
  .reading{grid-area:reading}
  .pager{grid-area:pager}

  /* ---------- parchment reading card ---------- */
  .reading{position:relative}
  .tabs{
    position:relative;z-index:2;display:flex;gap:5px;flex-wrap:wrap;
    padding:0 1px;
  }
  .tab{
    appearance:none;-webkit-appearance:none;cursor:pointer;
    font-family:var(--serif);font-size:13px;letter-spacing:.08em;
    color:#c8b394;
    padding:10px 15px 11px;border-radius:4px 4px 0 0;
    border:1px solid rgba(201,165,104,.26);border-bottom:1px solid transparent;
    background:linear-gradient(180deg,#33241a 0%,#261a12 100%);
    box-shadow:inset 0 1px 0 rgba(255,214,156,.10);
    transition:color .18s ease,background .18s ease;
  }
  .tab:hover{color:#f0e0c4}
  .tab .c{font-size:10px;color:var(--brass-dim);margin-left:3px;letter-spacing:.04em}
  .tab[aria-selected="true"]{
    z-index:3;margin-bottom:-1px;
    color:var(--ink);background:linear-gradient(180deg,var(--parch-1),var(--parch-2));
    border-color:var(--parch-line);border-bottom-color:var(--parch-1);
    box-shadow:inset 0 2px 0 var(--brass-soft);
    font-weight:600;
  }
  .tab[aria-selected="true"] .c{color:var(--brass-soft)}

  .paper{
    position:relative;z-index:1;
    padding:clamp(20px,4.4vw,38px) clamp(16px,4.2vw,40px) clamp(24px,5vw,44px);
    border:1px solid var(--parch-line);border-radius:0 2px 2px 2px;
    color:var(--ink);
    background:
      radial-gradient(110% 80% at 18% 0%,rgba(255,252,242,.9),transparent 58%),
      linear-gradient(165deg,var(--parch-1) 0%,var(--parch-2) 46%,var(--parch-3) 100%);
    box-shadow:
      0 30px 54px -32px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.65),
      inset 0 -26px 36px -30px rgba(96,64,32,.4);
  }
  .paper::before{
    content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background-image:url(img/noise.png);background-size:96px 96px;
    opacity:.42;mix-blend-mode:multiply;
  }
  .paper::after{
    content:'';position:absolute;left:0;top:0;bottom:0;width:16px;pointer-events:none;
    background:linear-gradient(90deg,rgba(120,84,44,.16),rgba(120,84,44,0));
    border-radius:inherit;
  }
  .panel{position:relative;z-index:1}
  .panel[hidden]{display:none}
  .panel p{
    margin:0 0 16px;font-size:15.2px;line-height:1.95;
    color:var(--ink-2);letter-spacing:-.002em;
    word-break:keep-all;overflow-wrap:break-word;
  }
  .panel p:last-child{margin-bottom:0}
  .panel p:first-of-type{font-size:15.6px}
  @media (max-width:520px){ .panel p{font-size:14.5px;line-height:1.92} }

  .points{
    margin:24px 0 0;padding:16px 18px;border-radius:2px;
    border:1px solid #d8c5a3;
    background:linear-gradient(180deg,#fbf4e5,#f5e9d2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  }
  .points .head{
    font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.28em;
    color:var(--brass-soft);margin:0 0 10px;
  }
  .points ul{list-style:none;margin:0;padding:0}
  .points li{
    position:relative;padding-left:14px;font-size:13.6px;line-height:1.8;
    color:var(--ink-2);margin:0 0 7px;
  }
  .points li:last-child{margin-bottom:0}
  .points li::before{content:'';position:absolute;left:0;top:.78em;width:6px;height:1px;background:var(--brass-soft)}

  .qlist{list-style:none;counter-reset:q;padding:0;margin:0}
  .qlist li{
    counter-increment:q;position:relative;
    padding:0 0 20px 42px;margin:0 0 20px;
    border-bottom:1px solid rgba(140,108,64,.20);
  }
  .qlist li:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
  .qlist li::before{
    content:counter(q,decimal-leading-zero);
    position:absolute;left:0;top:2px;width:30px;
    font-family:var(--serif);font-size:14px;font-weight:600;
    color:var(--brass-soft);letter-spacing:.04em;
  }
  .qlist .q{
    display:block;font-size:15px;font-weight:500;line-height:1.8;
    color:var(--ink);word-break:keep-all;overflow-wrap:break-word;
  }
  .qlist .why{
    display:block;margin-top:8px;padding-left:11px;
    border-left:2px solid rgba(201,165,104,.5);
    font-size:12.8px;line-height:1.75;color:var(--ink-soft);
    word-break:keep-all;overflow-wrap:break-word;
  }
  @media (max-width:520px){
    .qlist li{padding-left:34px}
    .qlist .q{font-size:14.2px}
    .qlist .why{font-size:12px}
  }

  .pager{
    display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;
    margin-top:32px;padding-top:20px;border-top:1px solid rgba(201,165,104,.18);
  }
  .pager a,.pager span{
    display:inline-flex;align-items:center;
    max-width:100%;padding:9px 14px;border-radius:2px;
    font-size:12.2px;letter-spacing:.04em;color:#e9dac0;
    border:1px solid rgba(201,165,104,.26);
    background:rgba(255,220,160,.03);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:border-color .18s ease,background .18s ease,color .18s ease;
  }
  .pager a:hover{border-color:rgba(201,165,104,.58);background:rgba(255,220,160,.08);color:#fdf3dd}
  .pager .dim{color:#6d5a45;border-color:rgba(201,165,104,.10);background:none}
  .pager .next{margin-left:auto}
  @media (max-width:600px){
    .pager{flex-direction:column;align-items:stretch}
    .pager .next{margin-left:0;justify-content:flex-end}
  }

  .foot{
    position:relative;z-index:1;
    margin-top:26px;padding:26px 0 54px;text-align:center;
    color:var(--muted-2);font-size:10.5px;letter-spacing:.24em;
  }
  .foot::before{
    content:'';display:block;width:100%;height:1px;margin:0 auto 22px;
    background:linear-gradient(90deg,transparent,rgba(201,165,104,.24),transparent);
  }
  .foot .mark{color:var(--brass-dim);margin-right:8px}

  :focus-visible{outline:2px solid var(--brass-lt);outline-offset:3px;border-radius:2px}
  .paper :focus-visible{outline-color:var(--brass-soft)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="site-head">
  <div class="top-rule"></div>
  <div class="wrap head-row">
    <a class="brand" href="#/" aria-label="제비책방 첫 화면">
      <span class="mark">❦</span>
      <span class="name">제비책방</span>
    </a>
    <div class="head-note">한 달에 한 번, 함께 읽고 이야기한 책</div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="foot"><span class="mark">❦</span>제비책방 · 한 달에 한 번, 함께 읽고 이야기한 책들</footer>

<script src="data.js"></script>
<script>
(function(){
  var app = document.getElementById('app');
  var YEARS = Object.keys(BOOKS).map(Number).sort(function(a,b){return a-b;});
  var KOR = ['첫','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한','열두','열세','열네','열다섯'];

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function totalCount(){
    return YEARS.reduce(function(n,y){ return n + BOOKS[y].length; }, 0);
  }
  function pad(n){ return n < 10 ? '0' + n : String(n); }
  function ordinal(n){ return (KOR[n-1] || String(n)) + ' 번째'; }

  /* ---------- views ---------- */
  function home(){
    var cards = YEARS.map(function(y){
      var books = BOOKS[y];
      var stack = books.slice(0,3).map(function(b){
        return '<img src="' + esc(b.cover) + '" alt="" loading="lazy">';
      }).join('');
      var label = books.length ? books.length + '권의 책' : '책을 기다리는 중';
      return '' +
        '<a class="year-card" href="#' + y + '">' +
          '<span class="corners" aria-hidden="true"></span>' +
          '<span class="yr">' + y + '</span>' +
          '<span class="sub">' + esc(label) + '</span>' +
          '<span class="stack">' + stack + '</span>' +
          '<span class="go">책장 펼쳐보기</span>' +
        '</a>';
    }).join('');

    document.title = '제비책방 — 우리가 함께 읽은 책';
    app.innerHTML = '' +
      '<section class="hero">' +
        '<div class="hero-wall" aria-hidden="true"></div>' +
        '<div class="sign">' +
          '<span class="crest" aria-hidden="true">❦</span>' +
          '<h1>제비책방</h1>' +
          '<div class="ornament" aria-hidden="true"><i></i><b>◆</b><i></i></div>' +
          '<p class="tagline">한 달에 한 번 모여 읽고 이야기한 책들의 기록</p>' +
          '<p class="lede">책을 누르면 <strong>작가 소개</strong>, <strong>줄거리</strong>, 그리고 모임에서 나눌 <strong>발제 열 가지</strong>를 볼 수 있습니다.</p>' +
        '</div>' +
      '</section>' +
      '<div class="shelf-label">연도별 책장</div>' +
      '<section class="years">' + cards + '</section>' +
      '<p class="home-foot">' + totalCount() + '권의 책<span class="dot">·</span>' +
        Math.min.apply(null, YEARS) + '–' + Math.max.apply(null, YEARS) + '</p>';
  }

  function yearView(y){
    var books = BOOKS[y];
    if(!books){ notFound(); return; }
    document.title = y + '년 · 제비책방';
    var cards = books.map(function(b, i){
      return '' +
        '<a class="book" href="#' + y + '/' + (i+1) + '">' +
          '<span class="cover"><img src="' + esc(b.cover) + '" alt="' + esc(b.title) + ' 표지" loading="lazy"></span>' +
          '<span class="plank" aria-hidden="true"></span>' +
          '<span class="cap">' +
            '<span class="no">NO. ' + pad(i+1) + '</span>' +
            '<span class="t">' + esc(b.title) + '</span>' +
            '<span class="a">' + esc(b.author) + '</span>' +
          '</span>' +
        '</a>';
    }).join('');

    app.innerHTML = '' +
      '<div class="page-top"><a class="back" href="#/">← 책방 앞으로</a></div>' +
      '<div class="year-head">' +
        '<h1>' + y + '년</h1>' +
        '<span class="count">' + (books.length ? books.length + '권' : '책을 기다리는 중') + '</span>' +
      '</div>' +
      '<div class="shelf-wall">' +
        (books.length ? '<div class="grid">' + cards + '</div>'
                      : '<p class="empty">책이 등록되면 이곳 책장에 표지와 함께 놓입니다.</p>') +
      '</div>';
  }

  function bookView(y, n){
    var books = BOOKS[y];
    if(!books || !books[n-1]){ notFound(); return; }
    var b = books[n-1];
    document.title = b.title + ' · 제비책방';

    var introParas = b.intro.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('');
    var summaryParas = b.summary.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('');
    var points = (b.points || []).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('');
    var qs = b.questions.map(function(item){
      return '<li><span class="q">' + esc(item.q) + '</span>' +
             (item.why ? '<span class="why">' + esc(item.why) + '</span>' : '') + '</li>';
    }).join('');

    var prev = n > 1 ? '<a href="#' + y + '/' + (n-1) + '">← ' + esc(books[n-2].title) + '</a>' : '<span class="dim">← 이전 책</span>';
    var next = n < books.length ? '<a class="next" href="#' + y + '/' + (n+1) + '">' + esc(books[n].title) + ' →</a>' : '<span class="next dim">다음 책 →</span>';

    app.innerHTML = '' +
      '<div class="detail">' +
        '<div class="detail-top">' +
          '<a class="back" href="#' + y + '">← ' + y + '년 책장</a>' +
          '<span class="crumb">NO. ' + pad(n) + ' / ' + pad(books.length) + '</span>' +
        '</div>' +
        '<div class="detail-grid">' +
          '<div class="cover-col">' +
            '<div class="big-cover"><img src="' + esc(b.cover) + '" alt="' + esc(b.title) + ' 표지"></div>' +
            '<div class="cover-meta"><span class="k">' + esc(b.author) + '</span><br>' + esc(b.meta) + '</div>' +
          '</div>' +
          '<div class="head-body">' +
            '<span class="eyebrow">' + y + '년 · ' + ordinal(n) + ' 책</span>' +
            '<h1 class="book-title">' + esc(b.title) + '</h1>' +
            '<p class="book-sub">' + esc(b.sub || '') + '</p>' +
            '<p class="book-author">' + esc(b.author) + '</p>' +
            '<p class="book-meta">' + esc(b.meta) + '</p>' +
          '</div>' +
        '<div class="reading">' +
          '<div class="tabs" role="tablist" aria-label="책 내용">' +
            '<button class="tab" role="tab" id="tab-0" aria-controls="panel-0" aria-selected="true" data-i="0">작가 소개</button>' +
            '<button class="tab" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="false" data-i="1">줄거리</button>' +
            '<button class="tab" role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false" data-i="2">발제<span class="c">' + b.questions.length + '</span></button>' +
          '</div>' +
          '<div class="paper">' +
            '<div class="panel" id="panel-0" role="tabpanel" aria-labelledby="tab-0">' + introParas + '</div>' +
            '<div class="panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1" hidden>' + summaryParas +
              (points ? '<div class="points"><p class="head">핵심 포인트</p><ul>' + points + '</ul></div>' : '') +
            '</div>' +
            '<div class="panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden><ol class="qlist">' + qs + '</ol></div>' +
          '</div>' +
        '</div>' +
          '<div class="pager">' + prev + next + '</div>' +
        '</div>' +
      '</div>';

    var tabs = app.querySelectorAll('.tab');
    tabs.forEach(function(t){
      t.addEventListener('click', function(){ selectTab(parseInt(t.dataset.i,10)); });
      t.addEventListener('keydown', function(e){
        var i = parseInt(t.dataset.i,10), ni = null;
        if(e.key === 'ArrowRight') ni = (i+1) % tabs.length;
        if(e.key === 'ArrowLeft')  ni = (i+tabs.length-1) % tabs.length;
        if(ni !== null){ e.preventDefault(); selectTab(ni); tabs[ni].focus(); }
      });
    });
  }

  function selectTab(i){
    app.querySelectorAll('.tab').forEach(function(t){
      var on = parseInt(t.dataset.i,10) === i;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    app.querySelectorAll('.panel').forEach(function(p, idx){
      p.hidden = idx !== i;
    });
  }

  function notFound(){
    document.title = '찾을 수 없음 · 제비책방';
    app.innerHTML = '<div class="page-top"><a class="back" href="#/">← 책방 앞으로</a></div>' +
      '<p class="empty">찾으시는 책이 없습니다.<br><br><a class="back" href="#/">책장으로 돌아가기 →</a></p>';
  }

  /* ---------- router ---------- */
  function route(){
    var raw = decodeURIComponent(location.hash.replace(/^#\/?/, '')).replace(/\/+$/,'');
    if(!raw){ home(); window.scrollTo(0,0); return; }
    var parts = raw.split('/').filter(Boolean);
    var y = parseInt(parts[0], 10);
    if(isNaN(y)){ notFound(); return; }
    if(parts.length === 1){ yearView(y); }
    else {
      var n = parseInt(parts[1], 10);
      if(isNaN(n)){ yearView(y); } else { bookView(y, n); }
    }
    window.scrollTo(0,0);
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
