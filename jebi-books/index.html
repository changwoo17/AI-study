<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제비책방 — 우리가 함께 읽은 책</title>
<meta name="description" content="한 달에 한 번 모여 읽고 이야기한 책들의 기록. 작가 소개, 줄거리, 그리고 발제 열 가지.">
<meta name="theme-color" content="#f7f2e8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f4a3a'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23f7f2e8'%3E%E2%9D%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f2e8;
    --paper-deep:#efe6d5;
    --card:#fffdf9;
    --ink:#2b2622;
    --ink-soft:#4a423b;
    --muted:#8a7d6d;
    --green:#2f4a3a;
    --green-2:#3f5f4a;
    --terra:#b0603c;
    --gold:#a98a52;
    --line:rgba(47,74,58,.14);
    --shadow:0 10px 24px -14px rgba(60,45,30,.45);
    --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(120,95,60,.05) .7px, transparent .7px);
    background-size:4px 4px;
    opacity:.7;
  }
  a{color:inherit;text-decoration:none}
  .wrap{position:relative;z-index:1;width:100%;max-width:1060px;margin:0 auto;padding:0 22px}

  /* ---------- header ---------- */
  .site-head{padding:26px 0 0}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .mark{font-size:15px;color:var(--gold);line-height:1}
  .brand .name{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.14em}
  .head-note{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  @media (max-width:639px){ .head-note{display:none} }

  /* ---------- home ---------- */
  .hero{padding:clamp(34px,7vw,74px) 0 clamp(26px,5vw,44px);text-align:center}
  .hero .fleuron{font-size:22px;color:var(--gold);letter-spacing:.4em;margin-bottom:18px}
  .hero h1{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(38px,9vw,64px);
    letter-spacing:.06em;margin:0 0 16px;line-height:1.15;
  }
  .hero .tagline{
    font-family:var(--serif);font-size:clamp(14px,3.4vw,17px);
    color:var(--ink-soft);letter-spacing:.02em;margin:0 auto;max-width:30em;
  }
  .hero .rule{width:44px;height:1px;background:var(--line);margin:26px auto}
  .hero .lede{font-size:14px;color:var(--muted);max-width:32em;margin:0 auto;line-height:1.85}

  .years{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;padding:6px 0 20px}
  .year-card{
    position:relative;display:block;background:var(--card);
    border:1px solid var(--line);border-radius:14px;
    padding:26px 24px 22px;overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .year-card:hover,.year-card:focus-visible{transform:translateY(-3px);box-shadow:0 16px 32px -18px rgba(60,45,30,.55);border-color:rgba(47,74,58,.26)}
  .year-card .yr{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:.04em;display:block;margin-bottom:2px}
  .year-card .sub{font-size:13px;color:var(--muted);letter-spacing:.02em}
  .stack{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:14px;height:172px;margin:22px 0 26px;padding-left:4px}
  .stack::after{content:'';position:absolute;left:6px;right:6px;bottom:-12px;height:1px;background:linear-gradient(90deg,rgba(47,74,58,0) 0%,rgba(47,74,58,.22) 18%,rgba(47,74,58,.22) 82%,rgba(47,74,58,0) 100%)}
  .stack img{
    width:104px;height:148px;object-fit:cover;border-radius:3px;
    box-shadow:0 12px 22px -14px rgba(50,35,20,.75), 0 0 0 1px rgba(60,45,30,.06);
    background:var(--paper-deep);
    transform-origin:bottom center;
  }
  .stack img:nth-child(1){transform:rotate(-3.5deg)}
  .stack img:nth-child(2){transform:rotate(0deg) translateY(-4px)}
  .stack img:nth-child(3){transform:rotate(3.5deg)}
  @media (max-width:639px){
    .stack{gap:8px;height:132px;margin:18px 0 16px}
    .stack img{width:78px;height:111px}
  }
  .year-card .go{position:absolute;right:20px;bottom:20px;font-size:13px;color:var(--green);letter-spacing:.04em}
  .year-card .go::after{content:' →'}

  .home-foot{text-align:center;padding:26px 0 60px;color:var(--muted);font-size:12.5px;line-height:1.9}

  /* ---------- year ---------- */
  .back{
    display:inline-flex;align-items:center;gap:7px;
    font-size:13px;color:var(--green);letter-spacing:.05em;
    padding:6px 0;margin-top:22px;
  }
  .back:hover{color:var(--terra)}
  .year-head{padding:14px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .year-head h1{font-family:var(--serif);font-size:clamp(30px,7vw,42px);font-weight:600;letter-spacing:.05em;margin:0}
  .year-head p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px;padding-bottom:16px}
  @media (min-width:620px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 22px} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 26px} }

  .book-card{display:block;transition:transform .18s ease}
  .book-card:hover,.book-card:focus-visible{transform:translateY(-4px)}
  .card-cover{
    position:relative;display:block;width:100%;aspect-ratio:7/10;border-radius:5px;overflow:hidden;
    background:var(--paper-deep);
    box-shadow:0 10px 18px -12px rgba(55,40,25,.65), 0 0 0 1px rgba(60,45,30,.08);
  }
  .card-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .card-cover .num{
    position:absolute;top:0;left:0;padding:5px 9px 6px;
    font-family:var(--serif);font-size:11.5px;letter-spacing:.08em;
    color:#fff;background:rgba(47,74,58,.82);
    border-bottom-right-radius:8px;
  }
  .card-title{display:block;font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.45;margin:12px 0 2px;letter-spacing:.01em}
  .card-author{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
  @media (max-width:759px){
    .card-title{font-size:13.6px;margin:10px 0 1px}
    .card-author{font-size:11.5px}
  }

  .empty{padding:40px 0 60px;text-align:center;color:var(--muted);font-size:14px}

  /* ---------- detail ---------- */
  .detail{padding-bottom:40px}
  .detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:18px}
  .detail-grid{display:grid;grid-template-columns:1fr;gap:28px;margin-top:8px}
  @media (min-width:880px){
    .detail-grid{grid-template-columns:300px minmax(0,1fr);gap:52px;align-items:start;margin-top:18px}
    .cover-col{position:sticky;top:26px}
  }
  .cover-col{max-width:210px}
  @media (min-width:880px){ .cover-col{max-width:300px} }
  .big-cover{
    width:100%;aspect-ratio:7/10;border-radius:6px;overflow:hidden;background:var(--paper-deep);
    box-shadow:0 24px 40px -24px rgba(50,35,20,.6), 0 0 0 1px rgba(60,45,30,.08);
  }
  .big-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-meta{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.8}
  .cover-meta .k{color:var(--ink-soft)}

  .book-eyebrow{font-size:12px;letter-spacing:.18em;color:var(--terra);text-transform:uppercase}
  .book-title{font-family:var(--serif);font-size:clamp(27px,6.2vw,38px);font-weight:600;line-height:1.3;letter-spacing:.01em;margin:8px 0 6px}
  .book-sub{font-family:var(--serif);font-size:15px;color:var(--ink-soft);line-height:1.6;margin:0 0 10px}
  .book-author{font-size:14px;color:var(--muted)}
  .book-author strong{color:var(--ink-soft);font-weight:500}

  .tabs{display:flex;gap:8px;margin:26px 0 0;border-bottom:1px solid var(--line);padding-bottom:0;flex-wrap:wrap}
  .tab{
    appearance:none;border:0;background:none;cursor:pointer;
    font-family:var(--sans);font-size:14px;color:var(--muted);
    padding:11px 4px 13px;margin-right:18px;letter-spacing:.03em;
    border-bottom:2px solid transparent;transition:color .15s ease,border-color .15s ease;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green);font-weight:600}
  .tab .c{font-size:11.5px;color:var(--gold);margin-left:2px}

  .panel{padding:26px 0 0}
  .panel p{margin:0 0 18px;font-size:15.5px;line-height:1.95;color:var(--ink-soft);letter-spacing:-.003em}
  .panel p:last-child{margin-bottom:0}
  .panel .lead{font-family:var(--serif);font-size:15px}

  .points{list-style:none;padding:0;margin:26px 0 0;background:linear-gradient(180deg,#fbf6ec,#f8f1e3);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .points li{position:relative;padding-left:16px;font-size:14px;line-height:1.85;color:var(--ink-soft);margin:0 0 8px}
  .points li:last-child{margin-bottom:0}
  .points li::before{content:'';position:absolute;left:0;top:.75em;width:6px;height:1px;background:var(--terra)}
  .points .head{font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;color:var(--gold);margin:0 0 12px;text-transform:uppercase}

  .qlist{list-style:none;counter-reset:q;padding:0;margin:0}
  .qlist li{
    counter-increment:q;position:relative;padding:0 0 22px 46px;margin:0 0 22px;
    border-bottom:1px dashed rgba(47,74,58,.16);
  }
  .qlist li:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
  .qlist li::before{
    content:counter(q,decimal-leading-zero);
    position:absolute;left:0;top:1px;
    font-family:var(--serif);font-size:13px;color:var(--terra);letter-spacing:.05em;
    width:32px;
  }
  .qlist .q{display:block;font-size:15.5px;line-height:1.8;color:var(--ink);font-weight:500}
  .qlist .why{display:block;margin-top:7px;font-size:13px;line-height:1.75;color:var(--muted);padding-left:11px;border-left:2px solid rgba(169,138,82,.35)}

  .pager{display:flex;gap:12px;justify-content:space-between;margin-top:44px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
  .pager a,.pager span{
    font-size:13.5px;color:var(--green);letter-spacing:.02em;padding:9px 14px;
    border:1px solid var(--line);border-radius:999px;background:rgba(255,253,249,.7);
  }
  .pager a:hover{border-color:rgba(47,74,58,.4);color:var(--terra)}
  .pager .dim{color:#b9ad9c;border-color:transparent;background:none}
  .pager .next{margin-left:auto}

  .foot{padding:44px 0 60px;text-align:center;color:#a2957f;font-size:12px;letter-spacing:.04em}

  :focus-visible{outline:2px solid var(--terra);outline-offset:3px;border-radius:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" href="#/" aria-label="제비책방 첫 화면">
      <span class="mark">❦</span>
      <span class="name">제비책방</span>
    </a>
    <div class="head-note">한 달에 한 번, 함께 읽고 이야기한 책</div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="foot">제비책방 — 한 달에 한 번, 함께 읽고 이야기한 책들</footer>

<script src="data.js"></script>
<script>
(function(){
  var app = document.getElementById('app');
  var YEARS = Object.keys(BOOKS).map(Number).sort(function(a,b){return a-b;});
  var currentTab = 0;

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function totalCount(){
    return YEARS.reduce(function(n,y){ return n + BOOKS[y].length; }, 0);
  }
  function pad(n){ return n < 10 ? '0' + n : String(n); }

  /* ---------- views ---------- */
  function home(){
    var cards = YEARS.map(function(y){
      var books = BOOKS[y];
      var stack = books.slice(0,3).map(function(b){
        return '<img src="' + esc(b.cover) + '" alt="" loading="lazy">';
      }).join('');
      var label = books.length ? books.length + '권의 책' : '책을 기다리는 중';
      return '' +
        '<a class="year-card" href="#' + y + '">' +
          '<span class="yr">' + y + '</span>' +
          '<span class="sub">' + esc(label) + '</span>' +
          '<span class="stack">' + stack + '</span>' +
          '<span class="go">펼쳐보기</span>' +
        '</a>';
    }).join('');

    document.title = '제비책방 — 우리가 함께 읽은 책';
    app.innerHTML = '' +
      '<section class="hero">' +
        '<div class="fleuron">❦</div>' +
        '<h1>제비책방</h1>' +
        '<p class="tagline">한 달에 한 번 모여 읽고 이야기한 책들의 기록</p>' +
        '<div class="rule"></div>' +
        '<p class="lede">책을 누르면 <strong>작가 소개</strong>, <strong>줄거리</strong>, 그리고 모임에서 나눌 <strong>발제 열 가지</strong>를 볼 수 있습니다.</p>' +
      '</section>' +
      '<section class="years">' + cards + '</section>' +
      '<p class="home-foot">지금까지 ' + totalCount() + '권 · ' + Math.min.apply(null, YEARS) + '–' + Math.max.apply(null, YEARS) + '</p>';
  }

  function yearView(y){
    var books = BOOKS[y];
    if(!books){ notFound(); return; }
    document.title = y + '년 · 제비책방';
    var cards = books.map(function(b, i){
      return '' +
        '<a class="book-card" href="#' + y + '/' + (i+1) + '">' +
          '<span class="card-cover">' +
            '<img src="' + esc(b.cover) + '" alt="' + esc(b.title) + ' 표지" loading="lazy">' +
            '<span class="num">' + pad(i+1) + '</span>' +
          '</span>' +
          '<span class="card-title">' + esc(b.title) + '</span>' +
          '<span class="card-author">' + esc(b.author) + '</span>' +
        '</a>';
    }).join('');

    app.innerHTML = '' +
      '<a class="back" href="#/">← 처음으로</a>' +
      '<div class="year-head">' +
        '<h1>' + y + '년</h1>' +
        '<p>' + (books.length ? books.length + '권의 책' : '아직 등록된 책이 없습니다') + '</p>' +
      '</div>' +
      (books.length ? '<div class="grid">' + cards + '</div>'
                    : '<p class="empty">책이 등록되면 이곳에 표지와 함께 나타납니다.</p>');
  }

  function bookView(y, n){
    var books = BOOKS[y];
    if(!books || !books[n-1]){ notFound(); return; }
    var b = books[n-1];
    document.title = b.title + ' · 제비책방';
    currentTab = 0;

    var introParas = b.intro.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('');
    var summaryParas = b.summary.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('');
    var points = (b.points || []).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('');
    var qs = b.questions.map(function(item){
      return '<li><span class="q">' + esc(item.q) + '</span>' +
             (item.why ? '<span class="why">' + esc(item.why) + '</span>' : '') + '</li>';
    }).join('');

    var prev = n > 1 ? '<a href="#' + y + '/' + (n-1) + '">← ' + esc(books[n-2].title) + '</a>' : '<span class="dim">← 이전 책</span>';
    var next = n < books.length ? '<a class="next" href="#' + y + '/' + (n+1) + '">' + esc(books[n].title) + ' →</a>' : '<span class="next dim">다음 책 →</span>';

    app.innerHTML = '' +
      '<div class="detail-top"><a class="back" href="#' + y + '">← ' + y + '년 목록</a></div>' +
      '<div class="detail-grid">' +
        '<div class="cover-col">' +
          '<div class="big-cover"><img src="' + esc(b.cover) + '" alt="' + esc(b.title) + ' 표지"></div>' +
          '<div class="cover-meta"><span class="k">' + esc(b.author) + '</span><br>' + esc(b.meta) + '</div>' +
        '</div>' +
        '<div class="detail-body">' +
          '<div class="book-eyebrow">' + y + '년 · ' + pad(n) + '번째 책</div>' +
          '<h1 class="book-title">' + esc(b.title) + '</h1>' +
          '<p class="book-sub">' + esc(b.sub || '') + '</p>' +
          '<p class="book-author"><strong>' + esc(b.author) + '</strong></p>' +
          '<div class="tabs" role="tablist" aria-label="책 내용">' +
            '<button class="tab" role="tab" id="tab-0" aria-controls="panel-0" aria-selected="true" data-i="0">작가 소개</button>' +
            '<button class="tab" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="false" data-i="1">줄거리</button>' +
            '<button class="tab" role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false" data-i="2">발제<span class="c">10</span></button>' +
          '</div>' +
          '<div class="panel" id="panel-0" role="tabpanel" aria-labelledby="tab-0">' + introParas + '</div>' +
          '<div class="panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1" hidden>' + summaryParas +
            (points ? '<div class="points"><p class="head">핵심 포인트</p><ul style="list-style:none;margin:0;padding:0">' + points + '</ul></div>' : '') +
          '</div>' +
          '<div class="panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden><ol class="qlist">' + qs + '</ol></div>' +
          '<div class="pager">' + prev + next + '</div>' +
        '</div>' +
      '</div>';

    var tabs = app.querySelectorAll('.tab');
    tabs.forEach(function(t){
      t.addEventListener('click', function(){ selectTab(parseInt(t.dataset.i,10)); });
      t.addEventListener('keydown', function(e){
        var i = parseInt(t.dataset.i,10), ni = null;
        if(e.key === 'ArrowRight') ni = (i+1) % tabs.length;
        if(e.key === 'ArrowLeft')  ni = (i+tabs.length-1) % tabs.length;
        if(ni !== null){ e.preventDefault(); selectTab(ni); tabs[ni].focus(); }
      });
    });
  }

  function selectTab(i){
    currentTab = i;
    app.querySelectorAll('.tab').forEach(function(t){
      var on = parseInt(t.dataset.i,10) === i;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    app.querySelectorAll('.panel').forEach(function(p, idx){
      p.hidden = idx !== i;
    });
  }

  function notFound(){
    document.title = '찾을 수 없음 · 제비책방';
    app.innerHTML = '<a class="back" href="#/">← 처음으로</a>' +
      '<p class="empty">찾으시는 책이 없습니다.<br><br><a class="back" href="#/">책장으로 돌아가기 →</a></p>';
  }

  /* ---------- router ---------- */
  function route(){
    var raw = decodeURIComponent(location.hash.replace(/^#\/?/, '')).replace(/\/+$/,'');
    if(!raw){ home(); window.scrollTo(0,0); return; }
    var parts = raw.split('/').filter(Boolean);
    var y = parseInt(parts[0], 10);
    if(isNaN(y)){ notFound(); return; }
    if(parts.length === 1){ yearView(y); }
    else {
      var n = parseInt(parts[1], 10);
      if(isNaN(n)){ yearView(y); } else { bookView(y, n); }
    }
    window.scrollTo(0,0);
  }

  window.addEventListener('hashchange', route);
  route();
})();
